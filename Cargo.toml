[package]
name = "image-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
mega-file = { path = "../../../rust_lib/mega/file" }
mega-ui = { path = "../../../rust_lib/mega/ui", features = ["wgpu"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
glam = "0.33.2"
env_logger = "0.11"
log = "0.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
