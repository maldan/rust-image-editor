[package]
name = "image-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
mega-file = { path = "../../../rust_lib/mega/file" }
mega-ui = { path = "../../../rust_lib/mega/ui", features = ["wgpu"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
glam = "0.33.2"
env_logger = "0.11"
log = "0.4"
rfd = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
dotenvy = "0.15"
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
tempfile = "3"
zstd = "0.13"
ffmpeg-next = { version = "9.0", default-features = false, features = ["format", "software-scaling"] }
